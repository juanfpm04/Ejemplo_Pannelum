<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>Custom hot spots</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <style>
    #panorama {
        width: 800px;
        height: 600px;
    }

    h1{
    font-size: 24px;
    margin: 0 0 15px;
    color: #111;
    }

    h2{
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
    }
    
    div.custom-tooltip span {
        visibility: hidden;
        position: absolute;
        background: linear-gradient(180deg, #ffffff 246px, #F4F4F4 247px,#F4F4F4);
         box-shadow: 2px 2px 5px #333333;
        border-radius: 5px;
        width: 244px;    
        text-align: center;
        cursor: default;
    }
    img {
        margin-top: 8px;
        width: 230px;
        height: 230px;
        object-fit: cover;
    }
    div.custom-tooltip:hover span{
        visibility: visible;
    }
    a {
        background-color: #001F4B;
        border: none;
        color: white;
        padding: 15px 30px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 15px 15px;
        cursor: pointer;
        border-radius: 5px;
}
a:hover {
  background-color:  #00D78B; 
  color: white;
}
div.custom-tooltip:hover a {
    transition: background-color 0.4s;
}
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "https://i.imgur.com/YO7sm02.jpeg",
    /*
     * Uncomment the next line to print the coordinates of mouse clicks
     * to the browser's developer console, which makes it much easier
     * to figure out where to place hot spots. Always remove it when
     * finished, though.
     */
    //"hotSpotDebug": true,
    "hotSpots": [
        {
            "pitch": 1,
            "yaw": 1.5,
            "type": "info",
            "createTooltipFunc": createImageTooltip,
            "createTooltipArgs": [
             /*Enlace de Imagen*/  "https://i.imgur.com/YO7sm02.jpeg",
             /*Producto*/       "Mesa Maker PRO",
             /*Tipo de Producto*/ "Mobiliario",
             /*Texto Boton*/      "Conoce Nuestos espacios"],
             
             
        },
        {
            "pitch": -9.4,
            "yaw": 222.6,
            "type": "info",
            "text": "Art Museum Drive"
        },
        {
            "pitch": -0.9,
            "yaw": 144.4,
            "type": "info",
            "text": "North Charles Street"
        }
    ]
});

function createImageTooltip(div, args) {
    var span = document.createElement('span');
    document.getElementById('panorama')
    span.style.maxWidth = 'initial';
    var image = document.createElement('img');
    span.innerHTML = `
    <img src="${args[0]}" width="95%"> 
    <h2>${args[2]}</h2>
    <h1>${args[1]}</h1>
    <a href="default.asp" target="_blank">${args[3]}</a>
    `;
    div.classList.add('custom-tooltip');
    div.appendChild(span);
    span.style.width = span.scrollWidth - 0 + 'px';
    span.style.marginLeft = -(span.scrollWidth - div.offsetWidth) / 2 + 'px';
    span.style.marginTop = -span.scrollHeight / 2 + 'px';
}


</script>
